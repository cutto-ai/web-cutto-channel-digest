name: CI
on: [push, pull_request]
jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Verify application when present
        run: |
          if [ -f package.json ]; then
            bun install --frozen-lockfile
            bun run typecheck
            bun test
            bun run build
          else
            test -f README.md
          fi
